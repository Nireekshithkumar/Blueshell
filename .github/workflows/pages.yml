name: Deploy BlueShells to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm install
      - name: Build with the registration endpoint
        env:
          VITE_REGISTRATION_ENDPOINT: ${{ vars.VITE_REGISTRATION_ENDPOINT }}
        run: |
          [[ "$VITE_REGISTRATION_ENDPOINT" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$ ]] || { echo "Set the deployed Apps Script /exec URL in repository variables"; exit 1; }
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publish
        uses: actions/deploy-pages@v4
